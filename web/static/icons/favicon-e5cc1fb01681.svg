<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<clipPath id="corners"><rect width="512" height="512" rx="112"/></clipPath>
<g clip-path="url(#corners)"><svg width="512" height="512" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<!-- The app icon. Edit this, then run `npm run icons` to regenerate every size.
     Draw a full square without rounded corners; the script rounds them where needed.
     Keep the mark inside the maskable safe zone: a circle of radius 204 around the centre. -->
<!-- A sun rising over the day's agenda: centred bars that shrink like its reflection on water. -->
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2a1a3e"/><stop offset="1" stop-color="#0e0a16"/></linearGradient>
<clipPath id="horizon"><rect width="512" height="258"/></clipPath>
</defs>
<rect width="512" height="512" fill="url(#bg)"/>
<circle cx="256" cy="258" r="130" fill="#ffd166" clip-path="url(#horizon)"/>
<rect x="126" y="278" width="260" height="26" rx="13" fill="#ffa76b"/>
<rect x="166" y="318" width="180" height="26" rx="13" fill="#ff7a7a"/>
<rect x="206" y="358" width="100" height="26" rx="13" fill="#ff5e7e"/>
</svg></g>
</svg>
